worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  lua_package_path '/usr/local/Cellar/luarocks/3.13.0_1/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;/usr/local/lib/lua/5.1/?.lua;/usr/local/lib/lua/5.1/?/init.lua;./?.lua;./?/init.lua;/Users/tomwoj/.luarocks/share/lua/5.1/?.lua;/Users/tomwoj/.luarocks/share/lua/5.1/?/init.lua;;';
  lua_package_cpath '/usr/local/lib/lua/5.1/?.so;/usr/local/lib/lua/5.1/loadall.so;./?.so;/Users/tomwoj/.luarocks/lib/lua/5.1/?.so;;';

  init_by_lua_block {
    require "lpeg"
    require "socket"
    require "ltn12"
    require "mime"
  }

  server {
    listen ${{PORT}};
    lua_code_cache ${{CODE_CACHE}};

    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;

    location / {
      default_type text/html;
      content_by_lua '
        require("lapis").serve("app")
      ';
    }

    location /static/ {
      if ($request_filename ~* \.es6$|\.scss$) {
        return 403;
      }

      access_log off;
      gzip on;
      gzip_types application/x-javascript text/css image/svg+xml;

      alias static/;
    }

    location /sw.js {
      alias static/service_worker.js;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }
  }
}
